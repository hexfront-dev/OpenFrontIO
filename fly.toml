app = "openfrontio"

[build]

[env]
  GAME_ENV = "prod"
  DOMAIN = "openfrontio.fly.dev"
  SUBDOMAIN = "main"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
