app = 'openfrontio'
primary_region = 'ams'

[build]

[env]
  GAME_ENV = "prod"
  DOMAIN = "openfrontio.fly.dev"
  SUBDOMAIN = "main"
  NUM_WORKERS = "1"
  TURNSTILE_SITE_KEY = "disabled"
  CDN_BASE = ""

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
